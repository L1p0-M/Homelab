name: "Wireguard"
description: "This lightweight LXC Container runs my Wireguard VPN Server,that helps me to connect back to my home network **Securely**"
environment: "Production"
type: "LXC"
status: "Active"
os: "Debian_"
ports:
  - name: "Wireguard"
    port: 51820
    protocol: "udp"
    access: "Internal/External"
  - name: "WGDashboard"
    port: 10086
    protocol: "tcp"
    access: "Internal"
