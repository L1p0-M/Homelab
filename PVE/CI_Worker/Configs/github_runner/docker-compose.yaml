---
services:
  runner-controller:
    image: ghcr.io/l1p0-m/github-runner-controller:v2.337.0@sha256:7ca9a41c4fe2ddda5443cfabb11903785128a07a57557d7a134ad510acee7153
    container_name: runner-controller
    restart: unless-stopped
    environment:
      - PUID=1000
      - DEBUG=info
      - PGID=1000
      - TZ=Europe/Budapest
      - TOKEN=${TOKEN}
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dockerconfig/github_runner/config.toml:/app/config.toml
