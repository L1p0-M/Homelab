---
services:
  runner-controller:
    image: ghcr.io/l1p0-m/github-runner-controller:v2.337.0@sha256:43436fdc9f74a2e375d4e2f595cb63ed199012e36f2dad14284969896e8aa647
    container_name: runner-controller
    restart: unless-stopped
    environment:
      - PUID=1000
      - DEBUG=info
      - PGID=1000
      - TZ=Europe/Budapest
      - TOKEN=${TOKEN}
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dockerconfig/github_runner/config.toml:/app/config.toml
