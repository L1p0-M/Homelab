---
services:
  runner-controller:
    image: ghcr.io/l1p0-m/github-runner-controller:v2.337.0@sha256:1e197af2f95a3ff070a006514693ed686dc13a429b259043b259341b2ed1cf6a
    container_name: runner-controller
    restart: unless-stopped
    environment:
      - PUID=1000
      - DEBUG=info
      - PGID=1000
      - TZ=Europe/Budapest
      - TOKEN=${TOKEN}
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dockerconfig/github_runner/config.toml:/app/config.toml
