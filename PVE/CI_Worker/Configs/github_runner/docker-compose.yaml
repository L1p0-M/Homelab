---
services:
  runner-controller:
    image: ghcr.io/l1p0-m/github-runner-controller:v2.337.0@sha256:7056473b2be5ba5035f3d4e33c56caebe510251baa3ed2947db89909950bef09
    container_name: runner-controller
    restart: unless-stopped
    environment:
      - PUID=1000
      - DEBUG=info
      - PGID=1000
      - TZ=Europe/Budapest
      - TOKEN=${TOKEN}
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dockerconfig/github_runner/config.toml:/app/config.toml
