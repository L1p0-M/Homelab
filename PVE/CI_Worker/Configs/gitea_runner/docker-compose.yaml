---
services:
  runner:
    image: gitea/runner
    container_name: ci_runner
    restart: always
    volumes:
      - /dockerconfig/gitea_runner/data/runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITEA_INSTANCE_URL=${URL}
      - GITEA_RUNNER_REGISTRATION_TOKEN=${TOKEN}
      - GITEA_RUNNER_NAME=CI-Worker
