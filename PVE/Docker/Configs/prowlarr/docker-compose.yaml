services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop@sha256:5f2281d9ba83f1edebe8e38823e6e5b174cf7958f6deb0cb992fc5f17eb0761f
    container_name: Prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/prowlarr/config:/config
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
