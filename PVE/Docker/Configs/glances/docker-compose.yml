---
services:
  glances:
    image: nicolargo/glances:4.5.6
    container_name: Glances
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
