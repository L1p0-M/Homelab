---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest@sha256:20ffca4512fcfc85dcd5612fb769233c1553192392d2ec417f0859135805f40c
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
      - PASSWORD=${PASSWORD}
      - PROXY_DOMAIN=${DOMAIN}
      - DEFAULT_WORKSPACE=/config/workspace
      - SUDO_PASSWORD=${SUDO_PASSWORD}
    volumes:
      - /dockerconfig/codeserver/config:/config
      - /dockerconfig:/dockerconfig
      - /hdd:/hdd
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
