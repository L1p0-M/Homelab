---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest@sha256:212d588e21815316d6525abe8d14bb0114fc2cf0499f08e9e34a1b514b1055b9
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
      - PASSWORD=${PASSWORD}
      - PROXY_DOMAIN=${DOMAIN}
      - DEFAULT_WORKSPACE=/config/workspace
      - SUDO_PASSWORD=${SUDO_PASSWORD}
    volumes:
      - /dockerconfig/codeserver/config:/config
      - /dockerconfig:/dockerconfig
      - /hdd:/hdd
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
