---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest@sha256:5d7aa5dbcf0ba770ee1a25151d110beefe37f400fa7a9108508f11f49627a548
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
      - PASSWORD=${PASSWORD}
      - PROXY_DOMAIN=${DOMAIN}
      - DEFAULT_WORKSPACE=/config/workspace
      - SUDO_PASSWORD=${SUDO_PASSWORD}
    volumes:
      - /dockerconfig/codeserver/config:/config
      - /dockerconfig:/dockerconfig
      - /hdd:/hdd
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
