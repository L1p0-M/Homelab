services:
  ombi:
    image: lscr.io/linuxserver/ombi:latest@sha256:8e5ffe4cac1538c4e423345bc07f577c4a49d61c3c2182c89fc9c4550b024489
    container_name: ombi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/ombi/config:/config
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
