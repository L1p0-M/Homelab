services:
  ombi:
    image: lscr.io/linuxserver/ombi:latest@sha256:877c43b00054117c23c728ad15b8bb8f9f26457155588c10dd9f38aae850d0f3
    container_name: ombi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/ombi/config:/config
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
