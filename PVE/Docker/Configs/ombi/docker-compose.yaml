services:
  ombi:
    image: lscr.io/linuxserver/ombi:latest@sha256:19d4f86713e7203d910b4aa431d7176e7a9a22f641beb1047da45aa989296509
    container_name: ombi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/ombi/config:/config
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
