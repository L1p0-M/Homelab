---
services:
  redis:
    container_name: redis_searxng
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - /dockerconfig/searxng/valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:2025.5.9-50406d4b4
    restart: unless-stopped
    ports:
      - "8181:8080"
    volumes:
      - /dockerconfig/searxng/data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=${IP}
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
networks:
  default:
    name: nginx_default
    external: true
