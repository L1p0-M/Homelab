---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:f78e9aa09610e778590ae81074fbcab69188900c0c860f917b31ae86b78fc047
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
