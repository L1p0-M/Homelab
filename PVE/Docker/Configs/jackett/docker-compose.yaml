---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:edb8935e0a769d3dff9bbc8d63723bce3adae9f5bb07feae17648bf5d2fca3c3
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
