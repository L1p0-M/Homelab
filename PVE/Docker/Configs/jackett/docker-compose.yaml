---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:02d06edfba069d0a60044fc70a80825c13de65e3131c1d517ef9281917c5c579
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
