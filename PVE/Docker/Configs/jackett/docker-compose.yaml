---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:cad378d39bb2e06f043678e888999ebf77f6128f3863ee7adc3394f959616752
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
