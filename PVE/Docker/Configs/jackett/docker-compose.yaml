---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:104a82c2f75892745d36b65a8c1244761e9f66678424ca547b203ff2ed708975
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
