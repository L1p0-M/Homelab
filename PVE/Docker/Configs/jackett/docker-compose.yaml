---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:3b1231402555facf27a030a246d90cdb97c6b46ef38c7566c2c041039b71797f
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
