---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:7a43726157aade04a50ffeb33590ddcdd541a7f92a35a81b307a2b950a2ffee7
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
