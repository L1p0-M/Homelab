---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:67fd20cb9095a9d938e50a29ac7ecc08acc408190603a87cc18c490564dfb265
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
