---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:609a1830692dd7728fba4c0d050a7d83e3213786500050cd14d26cfb7273b605
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
