---
services:
  jackett:
    image: ghcr.io/linuxserver/jackett:latest@sha256:b9dd4059409790bf5aac39331536b8c13cba07b5e8558877421f1b352e641f06
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/jackett/config:/config
      - /hdd/Movies:/downloads
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
