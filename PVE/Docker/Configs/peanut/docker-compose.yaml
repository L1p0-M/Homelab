services:
  peanut:
    image: brandawg93/peanut:6.1.1
    container_name: PeaNUT
    restart: unless-stopped
    environment:
      - NUT_HOST=${HOST}
      - NUT_PORT=${PORT}
      - WEB_PORT=8080
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
networks:
  default:
    name: nginx_default
    external: true
