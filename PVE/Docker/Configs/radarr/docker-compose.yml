---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    container_name: Radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/radarr/config:/config
      - /hddpool2:/hdd
      - /hddpool21:/hdd2
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
