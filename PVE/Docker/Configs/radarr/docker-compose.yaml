---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:ea6822c956d26db648b237919f41340318f32e5b7dcc4ba702cf256a0f5f3c12
    container_name: Radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/radarr/config:/config
      - /hddpool2:/hdd
      - /hddpool21:/hdd2
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
