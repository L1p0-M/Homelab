---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
    container_name: Radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/radarr/config:/config
      - /hddpool2:/hdd
      - /hddpool21:/hdd2
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
