---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    container_name: Radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/radarr/config:/config
      - /hddpool2:/hdd
      - /hddpool21:/hdd2
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
