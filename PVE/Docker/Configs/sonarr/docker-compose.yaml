services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:889dcc58c6aea859033985894b519b2e6b1e55d92527ed123f9f52e42ae7c97b
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/sonarr/config:/config
      - /hddpool3:/hdd1
      - /hddpool4:/hdd3
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
