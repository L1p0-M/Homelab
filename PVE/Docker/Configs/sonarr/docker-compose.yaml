services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
    volumes:
      - /dockerconfig/sonarr/config:/config
      - /hddpool3:/hdd1
      - /hddpool4:/hdd3
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
