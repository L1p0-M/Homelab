---
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:1fa2f9692501f27ce51c4fffd771d63ec38f1163cb648941c324344b7c5a3915
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Budapest
      - WEBUI_PORT=8300
    volumes:
      - /dockerconfig/qbittorrent/config:/config
      - /hddpool2:/hdd
      - /hddpool3:/hdd1
      - /hddpool21:/hdd2
      - /hddpool4:/hdd3
    ports:
      - 51000:51000
      - 51000:51000/udp
    restart: unless-stopped
networks:
  default:
    name: nginx_default
    external: true
