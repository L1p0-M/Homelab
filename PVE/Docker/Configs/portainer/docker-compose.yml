---
services:
  portainer:
    image: portainer/portainer-ce:2.45.0-alpine
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dockerconfig/portainer/data:/data
    ports:
      - 9000:9000
