name: "Network-UPS"
description: "This lightweight LXC Container runs Network-UPS-Tools(NUT),that monitors the main UPS via USB Passthrough. Triggers the automatic **Gracefull Shutdown** of the Nodes"
environment: "Production"
type: "LXC"
status: "Active"
os: "Debian"
ports:
  - name: "NUT API"
    port: 3493
    protocol: "tcp"
    access: "Internal"
  - name: "NUT WebUI at /cgi-bin/nut/upsset.cgi"
    port: 80
    protocol: "tcp"
    access: "Internal"