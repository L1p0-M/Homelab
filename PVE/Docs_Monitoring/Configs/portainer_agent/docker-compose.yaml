---
services:
    agent:
        image: portainer/agent:2.45.0
        volumes:
            - /:/host:ro
            - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        restart: always
        container_name: portainer_agent
        ports:
            - '9001:9001'
