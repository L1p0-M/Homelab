---
services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090/tcp
    user: '1000:1000'
    volumes:
      - /dockerconfig/grafana/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /dockerconfig/grafana/config/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:13.1.1
    container_name: grafana
    restart: unless-stopped
    user: '1000:1000'
    ports:
      - 3000:3000/tcp
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${USER}
      - GF_SECURITY_ADMIN_PASSWORD=${PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-worldmap-panel,grafana-piechart-panel
    volumes:
      - /dockerconfig/grafana/config/grafana:/var/lib/grafana

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    privileged: true
    devices:
      - "/dev/kmsg"
  prometheus-pve-exporter:
    container_name: pve-exporter
    restart: unless-stopped
    volumes:
      - /dockerconfig/grafana/config/pve-exporter/pve.yml:/etc/prometheus/pve.yml
    image: prompve/prometheus-pve-exporter:3.9.0
  nut-exporter:
    image: hon95/prometheus-nut-exporter:1.2.0
    container_name: nut-exporter
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      - HTTP_PATH=/metrics
      - RUST_LOG=info
      - HTTP_PORT=9995
      - HTTP_PATH=/nut
      - LOG_REQUESTS_CONSOLE=false
      - PRINT_METRICS_AND_EXIT=false
networks:
  default:
    name: grafana
