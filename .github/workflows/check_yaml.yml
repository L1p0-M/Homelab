name: Check YAML files for validity
on:
  pull_request:
    branches:
      - main
      - yaml_linter
    paths:
      - '**/*.yml'
      - '**/*.yaml'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      files: ${{ steps.changed-files.outputs.all_changed_files }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Get changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          dir_names_max_depth: 5
          files: |
            **/*.yaml
            **/*.yml

      - name: List to output
        id: changed-files-output
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo '${{ steps.changed-files.outputs.all_changed_files }}'


  check-yaml:
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    permissions:
      pull-requests: read
      contents: read
    strategy:
      matrix:
        files: ${{ fromJson(needs.detect-changes.outputs.files) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Check parameters
        run: |
          echo "File: ${{ matrix.files }}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint YAML files
        run: |
          echo "Linting file: ${{ matrix.files }}"
          python3 -m yamllint -d "{extends: relaxed, rules: {line-length: disable}}" "${{ matrix.files }}"

  check-compose:
    runs-on: self-hosted
    needs: [detect-changes, check-yaml]
    if: needs.detect-changes.outputs.has_changes == 'true' && (contains(needs.detect-changes.outputs.files, 'docker-compose.yml') || contains(needs.detect-changes.outputs.files, 'docker-compose.yaml'))
    strategy:
      matrix:
        files: ${{ fromJson(needs.detect-changes.outputs.files) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Check parameters
        run: |
          echo "File: ${{ matrix.files }}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose File
        if: endsWith(matrix.files, 'docker-compose.yml') || endsWith(matrix.files, 'docker-compose.yaml')
        run: |
          echo "Checking Compose file: ${{ matrix.files }}"
          dir=$(dirname "${{ matrix.files }}")

          grep -oE '\$\{?[A-Za-z0-9_]+' "${{ matrix.files }}" | tr -d '${' | sort -u | while read -r var; do
            echo "${var}=REDACTED" >> "$dir/.env.ci"
          done
          touch "$dir/.env.ci"

          COMPOSE_ENV_FILES="$dir/.env.ci"
          docker compose -f "${{ matrix.files }}" config -q
          response=$?

          rm -f "$dir/.env.ci"
          exit $response
