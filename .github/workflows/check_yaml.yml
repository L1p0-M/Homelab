name: Check YAML files for validity
on:
  pull_request:
    branches:
      - main
      - yaml_linter
    paths:
      - '**/*.yml'
      - '**/*.yaml'

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      files: ${{ steps.changed-files.outputs.all_changed_files }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Get changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          dir_names: true
          matrix: true
          dir_names_max_depth: 5
          files: |
            **/*.yaml
            **/*.yml

      - name: Write to output
        id: changed-files-output
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done


  check-yaml:
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    permissions:
      pull-requests: read
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.files) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Check parameters
        run: |
          echo "File: ${{ matrix.include }}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
        
      - name: Lint YAML files
        run: |
          echo "Linting file: ${{ matrix.include }}"
          yamllint "${{ matrix.include }}"


