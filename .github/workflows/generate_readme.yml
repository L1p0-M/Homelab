name: Generate README.md for VMs/LXCs
on:
  push:
    branches:
      - main
    paths:
      - '**/terraform.tfvars'
      - '**/metadata.yaml'

  workflow_dispatch:
    inputs:
      dir:
        description: 'Directory of the VM/LXC you want to force the run on(e.g.: PVE/WHPrinter)'
        required: true
        default: ''

permissions:
  contents: write
  pull-requests: write
  
jobs:
  update-readme:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          dir_names: true
          dir_names_max_depth: 5
          files_yaml: |
            configs:
              - '**/terraform.tfvars'
              - '**/metadata.yaml'

      - name: Generate README file for VM/LXC
        id: generate-readme
        run: |
          pip install python-hcl2 jinja2 pyyaml
          CHANGED_DIRS='${{ steps.changed-files.outputs.configs_all_changed_files }}'
          INPUT_DISPATCH='${{ inputs.dir }}'
          if [ -n "$INPUT_DISPATCH" ]; then
            python3 -u .github/workflows/scripts/generate_readme.py $INPUT_DISPATCH
          else
            python3 -u .github/workflows/scripts/generate_readme.py $CHANGED_DIRS
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BOT_TOKEN }}
          committer: "Cortana [bot] <cortana@l1p0-industries.hu>"
          author: "Cortana [bot] <cortana@l1p0-industries.hu>"
          assignees: "L1p0-M"
          commit-message: "CI: Automatic README.md Update"
          branch: "${{ steps.generate-readme.outputs.pr_branch || 'readme-updates' }}"
          title: "${{ steps.generate-readme.outputs.pr_title || 'docs(gitops): Auto-update documentation' }}"
          body: ${{ steps.generate-readme.outputs.pr_body }}
