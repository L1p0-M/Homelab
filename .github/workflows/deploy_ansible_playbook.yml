name: "Run Ansible Playbook / Deploy Services"
on:
  push:
    branches:
      - main
    paths:
      - 'PVE/Docker/Configs/**'
      - 'PVE/Media/Configs/**'
      - 'PVE/Docs_Monitoring/Configs/**'
      - 'PVE/CI_Worker/Configs/**'
      - 'ansible/**'

  workflow_dispatch:
    inputs:
      args:
        description: 'Args for ansible playbook(e.g.: --limit docker-hosts --check )'
        required: false
        default: ''
jobs:
  detect-changes:
    name: "Detect Changed Files"
    runs-on: self-hosted
    outputs:
      args: ${{ steps.set-args.outputs.args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          dir_names: true
          dir_names_max_depth: 5

      - name: Set ansible args
        id: set-args
        run: |
          if [ -n "${{ inputs.args }}" ]; then
            echo "args=${{ inputs.args }}" >> $GITHUB_OUTPUT
          else
            python3 -u .github/workflows/scripts/get_ansible_limits.py ${{ steps.changed-files.outputs.all_changed_files }}
          fi

  deploy-services:
    name: "Run Ansible Playbook / Deploy Compose Services"
    runs-on: self-hosted
    needs: detect-changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install SOPS
        uses: nhedger/setup-sops@v3
        with:
          version: "3.13.3"

      - name: Install Ansible & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user ansible
          echo "$(ansible --version)"
          ansible-galaxy collection install ansible.posix
          ansible-galaxy collection install community.general

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Vault password
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault_pass

      - name: Create config files from templates
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          find "./" -type f -name "*.template" -not -path "*/extensions/*" -not -path "*/code-server/*" 2> /dev/null | while read -r template; do
            basedir=$(dirname "$template")
            if [ -f "$basedir/.env.enc" ]; then
              sops --input-type dotenv --output-type dotenv --decrypt "$basedir/.env.enc" > "$basedir/.env"
            fi

            if [ -f "$basedir/.env" ]; then
              echo "Loading environment variables from .env..."
              set -a
              source "$basedir/.env"
              set +a
            fi

            output_file="${template%.template}"
            echo "Processing: $template -> $output_file"
            envsubst < "$template" > "$output_file"

            if [ -f "$basedir/.env" ]; then
              rm "$basedir/.env"
            fi
          done

      - name: Deploy stacks
        working-directory: ansible
        env:
          ANSIBLE_SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_CONFIG: 'ansible.cfg'
        run: |
          ARGS="${{ needs.detect-changes.outputs.args }}"
          if [ -n "$ARGS" ]; then
            echo "Executing ansible playbook with args: $ARGS"
            ansible-playbook site.yml $ARGS
          else
            echo "Executing full ansible playbook"
            ansible-playbook site.yml
          fi

      - name: Clean Up
        if: always()
        run: |
          rm -f ansible/.vault_pass
