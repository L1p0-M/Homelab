name: Check files on PR
on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: read
  contents: read

jobs:
  detect-changes:
    runs-on: self-hosted
    name: "Detect Changed Files"
    outputs:
      files: ${{ steps.changed-files.outputs.all_changed_files }}
      yaml: ${{ steps.changed-files.outputs.yaml_all_changed_files}}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
      yaml_has_changes: ${{ steps.changed-files.outputs.yaml_any_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Get changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          dir_names_max_depth: 5
          files_yaml: |
            yaml:
              - '**.yaml'
              - '**.yml'

  check-yaml:
    runs-on: self-hosted
    name: "YAML Syntax Check"
    needs: detect-changes
    if: needs.detect-changes.outputs.yaml_has_changes == 'true'
    strategy:
      matrix:
        files: ${{ fromJson(needs.detect-changes.outputs.yaml) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint YAML files
        run: |
          echo "Linting file: ${{ matrix.files }}"
          python3 -m yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, new-lines: disable}}" "${{ matrix.files }}"

      - name: Validate Compose File
        if: endsWith(matrix.files, 'docker-compose.yml') || endsWith(matrix.files, 'docker-compose.yaml')
        run: |
          echo "Checking Compose file: ${{ matrix.files }}"
          dir=$(dirname "${{ matrix.files }}")
          touch "$dir/.env.ci"

          grep -oE '\$\{?[A-Za-z0-9_]+' "${{ matrix.files }}" | tr -d '${' | sort -u | while read -r var; do
            echo "${var}=REDACTED" >> "$dir/.env.ci"
          done

          docker compose --env-file "$dir/.env.ci" -f "${{ matrix.files }}" config -q
          response=$?

          rm -f "$dir/.env.ci"
          exit $response

  check-response:
    name: "Check Response"
    runs-on: self-hosted
    if: ${{ always() }}
    needs: [detect-changes, check-yaml]
    steps:
      - name: Verify Checks Results
        run: |
          if [[ "${{ needs.check-yaml.result }}" == "failure" || "${{ needs.check-yaml.result }}" == "cancelled" ]]; then
            echo "YAML or Compose check failed!"
            exit 1
          fi
          echo "Everything looks good!"
