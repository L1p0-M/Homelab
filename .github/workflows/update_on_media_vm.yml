name: Update Media VM Containers
on:
  push:
    branches:
      - main
    paths:
      - 'PVE/Media/**'
jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed services
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          dir_names: true
          dir_names_max_depth: 5
          files_yaml: |
            configs:
              - 'PVE/Media/*/**'

      - name: Build matrix array
        id: set-matrix
        run: |
          CHANGED_DIRS='${{ steps.changed-files.outputs.configs_all_changed_files }}'
          
          if [ -z "$CHANGED_DIRS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          SERVICES_JSON=$(echo "$CHANGED_DIRS" | tr ' ' '\n' | grep -oP 'PVE/Media/Configs/\K[^/]+' | sort -u | jq -R . | jq -s -c .)
          
          echo "Affected services: $SERVICES_JSON"
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

  deploy-services:
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
      max-parallel: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SOPS
        uses: nhedger/setup-sops@v3
        with:
          version: "3.13.3"

      - name: Decrypt .env file for "${{ matrix.service }}"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          TARGET_DIR="PVE/Media/Configs/${{ matrix.service }}"
          if [ -f "$TARGET_DIR/.env.enc" ]; then
            sops --input-type dotenv --output-type dotenv --decrypt "$TARGET_DIR/.env.enc" > "$TARGET_DIR/.env"
            chmod 600 "$TARGET_DIR/.env"
          fi

      - name: Deploy "${{ matrix.service }}" via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_MEDIA_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /dockerconfig/${{ matrix.service }}

      - name: Sync files to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "PVE/Media/Configs/${{ matrix.service }}/"
          target: "/dockerconfig/${{ matrix.service }}"
          strip_components: 4
          tar_tmp_path: "/tmp"

      - name: Fix permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_MEDIA_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod -R g+rwX /dockerconfig/${{ matrix.service }}
            find /dockerconfig/${{ matrix.service }} -type d -exec chmod g+s {} +

      - name: Execute Docker Compose Up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_MEDIA_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /dockerconfig/${{ matrix.service }}
            docker compose pull
            docker compose up -d --remove-orphans
