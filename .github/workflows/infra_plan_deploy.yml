name: Plan/Deploy Infrastructure Changes
on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '!**/modules/*.tf'
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '!**/modules/*.tf'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed files
    runs-on: self-hosted
    outputs:
      files: ${{ steps.changed-files.outputs.all_changed_files }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed Files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          dir_names: true
          matrix: true
          dir_names_max_depth: 3
          files: |
            **/*.tf
          files_ignore: |
            **/modules/**/*.tf

  plan-deploy-changes:
    name: Plan/Deploy Infrastructure Changes
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    concurrency:
      group: terraform-${{ matrix.files }}
      cancel-in-progress: true
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
    permissions:
      pull-requests: write
      contents: read
    strategy:
      matrix:
        files: ${{ fromJson(needs.detect-changes.outputs.files) }}
      fail-fast: false
      max-parallel: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Run Terraform init for "${{ matrix.files }}"
        working-directory: ${{ matrix.files }}
        run: |
          terraform init -input=false

      - name: Run Terraform plan for "${{ matrix.files }}"
        working-directory: ${{ matrix.files }}
        run: |
          terraform plan -no-color -out=tfplan > plan_output.txt
          cat plan_output.txt

      - name: Deploy Changes to "${{ matrix.files }}"
        if: github.event_name == 'push'
        working-directory: ${{ matrix.files }}
        run: |
            terraform apply -auto-approve tfplan

      - name: Comment Plan output on PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        env:
          TARGET: ${{ matrix.files }}
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const planFile = `${process.env.TARGET}/plan_output.txt`;

            let planText = "";
            if (fs.existsSync(planFile)) {
              planText = fs.readFileSync(planFile, 'utf8');
            } else {
              planText = "Plan output file not found.";
            }

            // GitHub limit is 65,000 char
            const maxLen = 60000;
            if (planText.length > maxLen) {
              planText = planText.substring(0, maxLen) + "\n... (truncated)";
            }

            const output = `### 📋 Terraform Plan: \`${process.env.TARGET}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${planText}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  check-inventory-changes:
    name: Check/Commit Ansible Inventory Changes
    runs-on: self-hosted
    concurrency:
      group: inventory-changes
      cancel-in-progress: true
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check ansible inventory for changes
        if: github.event_name == 'pull_request'
        id: generate-inventory
        run: |
          python3 -u .github/workflows/scripts/post_terraform.py --output ansible/inventory.ini --search ./terraform --modules ./terraform/modules

      - name: Commit back the inventory file
        if: github.event_name == 'pull_request' && steps.generate-inventory.outputs.has_changes == 'true'
        run: |
          git config user.name "Cortana-Renovate"
          git config user.email "cortana@l1p0-industries.hu"
          git add ansible/inventory.ini
          git commit -m "ops(ansible): Auto-update Ansible inventory"
          git push
