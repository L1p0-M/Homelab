---

- name: Apply base configuration to all nodes
  hosts: all:!excluded
  gather_facts: false
  tasks:
    - name: Gather facts from reachable hosts
      ansible.builtin.setup:
      ignore_unreachable: true
      register: reachable_hosts

    - name: Apply base configuration to reachable hosts
      ansible.builtin.include_role:
        name: base
      when: reachable_hosts is defined and reachable_hosts.ansible_facts is defined
  tags: [base]

- name: Setup Docker on Docker hosts
  hosts: docker_hosts
  gather_facts: true
  roles:
    - role: docker_host
      tags: [docker_host]

- name: Setup Printer hosts
  hosts: printer
  gather_facts: true
  roles:
    - role: printer
      tags: [printer]

- name: Setup DDNS hosts
  hosts: ddns
  gather_facts: true
  roles:
    - role: ddns
      tags: [ddns]

- name: Setup NUT clients/server
  hosts: ups
  gather_facts: true
  roles:
    - role: ups
      tags: [ups, nut]

- name: Setup Wireguard server
  hosts: vpn
  gather_facts: true
  roles:
    - role: vpn
      tags: [vpn, wireguard]
