---
- name: Ensure trash directory exists
  ansible.builtin.file:
    path: "{{ docker_host_trash_dir }}"
    state: directory
    mode: "2775"
    group: "homelab-devs"
    owner: "{{ my_user }}"

- name: Extract stack names from Git app_stacks
  ansible.builtin.set_fact:
    docker_host_expected_stacks: "{{ app_stacks | default([]) | map('basename') | list }}"

- name: Find all stack directories on remote host
  ansible.builtin.find:
    paths: "{{ docker_host_stacks_dir }}"
    file_type: any
    recurse: false
    hidden: false
    excludes:
      - ".trash"
  register: docker_host_found_directories

- name: Extract remote stack names from disk
  ansible.builtin.set_fact:
    docker_host_remote_stacks: "{{ docker_host_found_directories.files | map(attribute='path') | map('basename') | list }}"

- name: Identify orphaned stacks to purge
  ansible.builtin.set_fact:
    docker_host_orphaned_stacks: "{{ docker_host_remote_stacks | difference(docker_host_expected_stacks) }}"

- name: Display identified orphaned stacks
  ansible.builtin.debug:
    msg: "Found orphaned stacks to purge: {{ docker_host_orphaned_stacks }}"
  when: docker_host_orphaned_stacks | length > 0

- name: Check if compose files exist for orphaned stacks
  ansible.builtin.stat:
    path: "{{ docker_host_stacks_dir }}/{{ item }}/docker-compose.yml"
  loop: "{{ docker_host_orphaned_stacks }}"
  register: docker_host_compose_files_stat

- name: Stop and remove orphaned stacks
  community.docker.docker_compose_v2:
    project_src: "{{ item.item }}"
    state: absent
    remove_volumes: true
  loop: "{{ docker_host_compose_files_stat.results }}"
  when: item.stat.exists

- name: Copy orphaned/drifted files to trash
  ansible.builtin.copy:
    src: "{{ docker_host_stacks_dir }}/{{ item }}"
    dest: "{{ docker_host_trash_dir }}/{{ item }}_{{ now(utc=true, fmt='%Y-%m-%d_%H-%M') }}"
    mode: preserve
    remote_src: true
  loop: "{{ docker_host_orphaned_stacks }}"
  register: docker_host_removed_files
  when: docker_host_orphaned_stacks | length > 0

- name: Remove files from remote host
  ansible.builtin.file:
    path: "{{ item.src }}"
    state: absent
  loop: "{{ docker_host_removed_files.results }}"
  when: docker_host_removed_files.results | length > 0

- name: Find expired stacks in trash
  ansible.builtin.find:
    paths: "{{ docker_host_trash_dir }}"
    file_type: any
    age: "{{ docker_host_retention_days }}d"
  register: docker_host_expired_trash

- name: Permanently purge expired trash stacks
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_host_expired_trash.files }}"
  when: docker_host_expired_trash.matched > 0
