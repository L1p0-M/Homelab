---
- name: Ensure target directories exist
  ansible.builtin.file:
    path: "{{ docker_host_stacks_dir }}/{{ item | basename }}"
    state: directory
    mode: "2775"
    group: "homelab-devs"
    owner: "{{ my_user }}"
  loop: "{{ app_stacks | default([]) }}"

- name: Remove legacy docker-compose.yml from remote host
  ansible.builtin.file:
    path: "{{ docker_host_stacks_dir }}/{{ item | basename }}/docker-compose.yml"
    state: absent
  loop: "{{ app_stacks | default([]) }}"

- name: Copy files to remote host
  ansible.builtin.copy:
    src: "{{ lookup('ansible.builtin.first_found', find_spec) }}"
    dest: "{{ docker_host_stacks_dir }}/{{ item | basename }}/docker-compose.yaml"
    mode: "0664"
    owner: "{{ deploy_user }}"
    group: "homelab-devs"
  loop: "{{ app_stacks | default([]) }}"
  vars:
    find_spec:
      files:
        - "docker-compose.yaml"
        - "docker-compose.yml"
      paths:
        - "{{ item }}"

- name: Write decrypted .env file to remote host
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', item + '/.env.enc', input_type='dotenv', output_type='dotenv', age_key=sops_key) }}"
    dest: "{{ docker_host_stacks_dir }}/{{ item | basename }}/.env"
    mode: "0660"
    owner: "{{ deploy_user }}"
    group: "homelab-devs"
  when: query("ansible.builtin.fileglob", item + "/.env.enc") | length > 0
  loop: "{{ app_stacks | default([]) }}"

# - name: Find template files in local repository stack directories
#   ansible.builtin.find:
#     paths: "{{ item }}"
#     patterns: "*.template.j2"
#     recurse: true
#   loop: "{{ app_stacks | default([]) }}"
#   register: docker_host_found_templates
#   delegate_to: localhost
