- name: Ensure subdirectories for templates exist on remote host
  ansible.builtin.file:
    path: "{{ docker_host_stacks_dir }}/{{ item_stack_name }}/{{ relative_template_path | dirname }}"
    state: directory
    mode: "2775"
    owner: "{{ my_user }}"
    group: "homelab-devs"
  loop: "{{ app_templates | default([]) }}"
  loop_control:
    loop_var: template_item
  vars:
    parent_stack: "{{ (app_stacks | select('in', template_item) | list | first) | default('') }}"
    item_stack_name: "{{ parent_stack | basename }}"
    relative_raw_path: "{{ template_item | relpath(parent_stack) }}"
    relative_template_path: "{{ relative_raw_path | regex_replace('\\.template\\.j2$', '') }}"

- name: Render and Copy template files to remote host
  ansible.builtin.template:
    src: "{{ template_item }}"
    dest: "{{ docker_host_stacks_dir }}/{{ item_stack_name }}/{{ relative_template_path }}"
    mode: "0664"
    owner: "{{ deploy_user }}"
    group: "homelab-devs"
  loop: "{{ app_templates | default([]) }}"
  loop_control:
    loop_var: template_item
  vars:
    parent_stack: "{{ (app_stacks | select('in', template_item) | list | first) | default('') }}"
    item_stack_name: "{{ parent_stack | basename }}"
    relative_raw_path: "{{ template_item | relpath(parent_stack) }}"
    relative_template_path: "{{ relative_raw_path | regex_replace('\\.template\\.j2$', '') }}"

