- name: Deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_host_stacks_dir }}/{{ item | basename }}"
    state: present
    remove_orphans: true
    recreate: auto
  loop: "{{ app_stacks | default([]) }}"
  when: (item | basename) != "github_runner"

- name: Schedule CI Runner restart in background
  ansible.builtin.shell: |
    nohup bash -c "sleep 60 &&\
    docker compose -f {{ docker_host_stacks_dir }}/{{ item | basename }}/docker-compose.yaml up -d --remove-orphans" > /dev/null 2>&1 &
  changed_when: false
  when: (item | basename) == 'github_runner'
  loop: "{{ app_stacks | default([]) }}"

- name: Prune old Images
  community.docker.docker_prune:
    images: true
    containers: false
    volumes: false
    networks: false
    images_filters:
      until: 24h
      dangling: false
  register: docker_host_pruned_images

- name: Show reclaimed Space
  ansible.builtin.debug:
    msg: "Reclaimed Space: {{ (docker_host_pruned_images.images_space_reclaimed | default(0)) | human_readable }}"
